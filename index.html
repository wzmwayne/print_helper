<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>手动双面打印助手 - 灵蝶版</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <h1>📄 手动双面打印助手</h1>
    <p>上传PDF，自动分离奇偶页并逆序排列（需灵蝶）</p>
    
    <input type="file" id="fileInput" accept=".pdf">
    <br><br>
    <button id="processBtn" disabled>开始处理</button>
    
    <p id="status">就绪</p>
    <progress id="progressBar" value="0" max="100"></progress>
    
    <div id="resultArea" hidden>
        <p id="resultInfo"></p>
        <a id="downloadOdd" href="#" download="奇数页.pdf">下载奇数页</a>
        <a id="downloadEven" href="#" download="偶数页.pdf">下载偶数页</a>
    </div>

    <!-- 灵蝶未安装提示 -->
    <div id="sw-install-hint" style="position:fixed;bottom:20px;right:20px;background:#2c3e50;color:#ecf0f1;padding:10px 16px;font-size:14px;z-index:9999;display:none;">
        ⚡ 本页面有动态功能，<a href="https://github.com/wzmwayne/ScriptWeaver" target="_blank" style="color:#3b82f6;">安装灵蝶</a> 后体验更好。
    </div>
    
    <!-- 灵蝶未安装检测（普通脚本，所有浏览器均执行） -->
    <script>
        (function() {
            if (!window.__ScriptWeaver__) {
                document.getElementById('sw-install-hint').style.display = 'block';
            }
        })();
    </script>

    <!-- 核心功能由灵蝶注入执行 -->
    <script type="x-tm-inline">
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const statusP = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const resultArea = document.getElementById('resultArea');
        const resultInfo = document.getElementById('resultInfo');
        const downloadOdd = document.getElementById('downloadOdd');
        const downloadEven = document.getElementById('downloadEven');

        let selectedFile = null;

        fileInput.addEventListener('change', () => {
            selectedFile = fileInput.files[0];
            if (selectedFile && selectedFile.type === 'application/pdf') {
                processBtn.disabled = false;
                statusP.textContent = '已选择文件：' + selectedFile.name;
            } else {
                processBtn.disabled = true;
                statusP.textContent = '请选择有效的PDF文件';
            }
        });

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            processBtn.disabled = true;
            statusP.textContent = '读取文件中...';
            progressBar.value = 0;
            resultArea.hidden = true;

            // 移除旧打印按钮
            const oldPrintOdd = document.getElementById('printOddBtn');
            const oldPrintEven = document.getElementById('printEvenBtn');
            if (oldPrintOdd) oldPrintOdd.remove();
            if (oldPrintEven) oldPrintEven.remove();

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const totalPages = pdfDoc.getPageCount();
                
                statusP.textContent = `共 ${totalPages} 页，正在分离...`;
                progressBar.max = totalPages;

                const oddDoc = await PDFLib.PDFDocument.create();
                const evenDoc = await PDFLib.PDFDocument.create();

                const oddIndices = [];
                const evenIndices = [];
                for (let i = 0; i < totalPages; i++) {
                    if (i % 2 === 0) {
                        oddIndices.push(i);
                    } else {
                        evenIndices.push(i);
                    }
                }
                oddIndices.reverse();
                evenIndices.reverse();

                let processed = 0;
                for (const idx of oddIndices) {
                    const [copiedPage] = await oddDoc.copyPages(pdfDoc, [idx]);
                    oddDoc.addPage(copiedPage);
                    processed++;
                    progressBar.value = processed;
                    statusP.textContent = `处理奇数页 ${processed}/${oddIndices.length}`;
                }

                for (const idx of evenIndices) {
                    const [copiedPage] = await evenDoc.copyPages(pdfDoc, [idx]);
                    evenDoc.addPage(copiedPage);
                    processed++;
                    progressBar.value = processed;
                    statusP.textContent = `处理偶数页 ${processed - oddIndices.length}/${evenIndices.length}`;
                }

                const oddPdfBytes = await oddDoc.save();
                const evenPdfBytes = await evenDoc.save();

                const oddBlob = new Blob([oddPdfBytes], { type: 'application/pdf' });
                const evenBlob = new Blob([evenPdfBytes], { type: 'application/pdf' });

                downloadOdd.href = URL.createObjectURL(oddBlob);
                downloadEven.href = URL.createObjectURL(evenBlob);

                resultInfo.textContent = `完成：原始 ${totalPages} 页 → 奇数页 ${oddDoc.getPageCount()} 页，偶数页 ${evenDoc.getPageCount()} 页`;

                // 创建打印按钮，采用“人教课本爬取器”的新窗口打印模式
                const printOddBtn = document.createElement('button');
                printOddBtn.id = 'printOddBtn';
                printOddBtn.textContent = '🖨️ 打印奇数页';
                printOddBtn.style.marginRight = '8px';
                printOddBtn.addEventListener('click', () => {
                    // 在新窗口中打开奇数页PDF并调用打印
                    const printWindow = window.open('', '_blank');
                    if (!printWindow) {
                        alert('浏览器阻止了弹窗，请允许后重试');
                        return;
                    }
                    printWindow.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <meta charset="UTF-8">
                            <title>打印奇数页</title>
                            <style>
                                * { margin: 0; padding: 0; box-sizing: border-box; }
                                body, html { width: 100%; height: 100%; overflow: hidden; }
                                iframe { width: 100%; height: 100%; border: none; }
                                @page { margin: 0; }
                            </style>
                        </head>
                        <body>
                            <iframe id="pdfFrame" src="${downloadOdd.href}" style="width:100%; height:100%; border:none;"></iframe>
                            <script>
                                document.getElementById('pdfFrame').onload = function() {
                                    setTimeout(() => {
                                        window.print();
                                    }, 500);
                                };
                            <\/script>
                        </body>
                        </html>
                    `);
                    printWindow.document.close();
                });

                const printEvenBtn = document.createElement('button');
                printEvenBtn.id = 'printEvenBtn';
                printEvenBtn.textContent = '🖨️ 打印偶数页';
                printEvenBtn.addEventListener('click', () => {
                    // 在新窗口中打开偶数页PDF并调用打印
                    const printWindow = window.open('', '_blank');
                    if (!printWindow) {
                        alert('浏览器阻止了弹窗，请允许后重试');
                        return;
                    }
                    printWindow.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <meta charset="UTF-8">
                            <title>打印偶数页</title>
                            <style>
                                * { margin: 0; padding: 0; box-sizing: border-box; }
                                body, html { width: 100%; height: 100%; overflow: hidden; }
                                iframe { width: 100%; height: 100%; border: none; }
                                @page { margin: 0; }
                            </style>
                        </head>
                        <body>
                            <iframe id="pdfFrame" src="${downloadEven.href}" style="width:100%; height:100%; border:none;"></iframe>
                            <script>
                                document.getElementById('pdfFrame').onload = function() {
                                    setTimeout(() => {
                                        window.print();
                                    }, 500);
                                };
                            <\/script>
                        </body>
                        </html>
                    `);
                    printWindow.document.close();
                });

                // 将打印按钮插入到下载链接之前
                resultArea.insertBefore(printEvenBtn, downloadOdd);
                resultArea.insertBefore(printOddBtn, printEvenBtn);

                resultArea.hidden = false;
                statusP.textContent = '处理完成，可点击打印或下载';
            } catch (error) {
                statusP.textContent = '错误：' + error.message;
                console.error(error);
            } finally {
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
