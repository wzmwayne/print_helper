<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>手动双面打印助手 - 灵蝶版</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <h1>📄 手动双面打印助手</h1>
    <p>上传PDF，自动分离奇偶页并逆序排列（需灵蝶）</p>
    
    <input type="file" id="fileInput" accept=".pdf">
    <br><br>
    <button id="processBtn" disabled>开始处理</button>
    
    <p id="status">就绪</p>
    <progress id="progressBar" value="0" max="100"></progress>
    
    <div id="resultArea" hidden>
        <p id="resultInfo"></p>
        <a id="downloadOdd" href="#" download="奇数页.pdf">下载奇数页</a>
        <a id="downloadEven" href="#" download="偶数页.pdf">下载偶数页</a>
    </div>

    <!-- 灵蝶未安装提示 -->
    <div id="sw-install-hint" style="position:fixed;bottom:20px;right:20px;background:#2c3e50;color:#ecf0f1;padding:10px 16px;font-size:14px;z-index:9999;display:none;">
        ⚡ 本页面有动态功能，<a href="https://github.com/wzmwayne/ScriptWeaver" target="_blank" style="color:#3b82f6;">安装灵蝶</a> 后体验更好。
    </div>
    
    <!-- 灵蝶未安装检测 -->
    <script>
        (function() {
            if (!window.__ScriptWeaver__) {
                document.getElementById('sw-install-hint').style.display = 'block';
            }
        })();
    </script>

    <!-- 核心功能由灵蝶注入执行 -->
    <script type="x-tm-inline">
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const statusP = document.getElementById('status');
        const progressBar = document.getElementById('progressBar');
        const resultArea = document.getElementById('resultArea');
        const resultInfo = document.getElementById('resultInfo');
        const downloadOdd = document.getElementById('downloadOdd');
        const downloadEven = document.getElementById('downloadEven');

        let selectedFile = null;

        fileInput.addEventListener('change', () => {
            selectedFile = fileInput.files[0];
            if (selectedFile && selectedFile.type === 'application/pdf') {
                processBtn.disabled = false;
                statusP.textContent = '已选择文件：' + selectedFile.name;
            } else {
                processBtn.disabled = true;
                statusP.textContent = '请选择有效的PDF文件';
            }
        });

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            processBtn.disabled = true;
            statusP.textContent = '读取文件中...';
            progressBar.value = 0;
            resultArea.hidden = true;

            // 移除旧按钮
            const oldViewOdd = document.getElementById('viewOddBtn');
            const oldViewEven = document.getElementById('viewEvenBtn');
            if (oldViewOdd) oldViewOdd.remove();
            if (oldViewEven) oldViewEven.remove();

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const totalPages = pdfDoc.getPageCount();
                
                statusP.textContent = `共 ${totalPages} 页，正在分离...`;
                progressBar.max = totalPages;

                const oddDoc = await PDFLib.PDFDocument.create();
                const evenDoc = await PDFLib.PDFDocument.create();

                const oddIndices = [];
                const evenIndices = [];
                for (let i = 0; i < totalPages; i++) {
                    if (i % 2 === 0) {
                        oddIndices.push(i);
                    } else {
                        evenIndices.push(i);
                    }
                }
                oddIndices.reverse();
                evenIndices.reverse();

                let processed = 0;
                for (const idx of oddIndices) {
                    const [copiedPage] = await oddDoc.copyPages(pdfDoc, [idx]);
                    oddDoc.addPage(copiedPage);
                    processed++;
                    progressBar.value = processed;
                    statusP.textContent = `处理奇数页 ${processed}/${oddIndices.length}`;
                }

                for (const idx of evenIndices) {
                    const [copiedPage] = await evenDoc.copyPages(pdfDoc, [idx]);
                    evenDoc.addPage(copiedPage);
                    processed++;
                    progressBar.value = processed;
                    statusP.textContent = `处理偶数页 ${processed - oddIndices.length}/${evenIndices.length}`;
                }

                const oddPdfBytes = await oddDoc.save();
                const evenPdfBytes = await evenDoc.save();

                // 下载链接仍保留（可选）
                const oddBlob = new Blob([oddPdfBytes], { type: 'application/pdf' });
                const evenBlob = new Blob([evenPdfBytes], { type: 'application/pdf' });
                downloadOdd.href = URL.createObjectURL(oddBlob);
                downloadEven.href = URL.createObjectURL(evenBlob);

                resultInfo.textContent = `完成：原始 ${totalPages} 页 → 奇数页 ${oddDoc.getPageCount()} 页，偶数页 ${evenDoc.getPageCount()} 页`;

                // 创建查看按钮，打开新窗口显示图片
                const viewOddBtn = document.createElement('button');
                viewOddBtn.id = 'viewOddBtn';
                viewOddBtn.textContent = '📄 查看奇数页';
                viewOddBtn.style.marginRight = '8px';
                viewOddBtn.addEventListener('click', () => {
                    openPdfPreviewWindow(oddPdfBytes, '奇数页');
                });

                const viewEvenBtn = document.createElement('button');
                viewEvenBtn.id = 'viewEvenBtn';
                viewEvenBtn.textContent = '📄 查看偶数页';
                viewEvenBtn.addEventListener('click', () => {
                    openPdfPreviewWindow(evenPdfBytes, '偶数页');
                });

                // 插入按钮
                resultArea.insertBefore(viewEvenBtn, downloadOdd);
                resultArea.insertBefore(viewOddBtn, viewEvenBtn);

                resultArea.hidden = false;
                statusP.textContent = '处理完成，可点击查看或下载';
            } catch (error) {
                statusP.textContent = '错误：' + error.message;
                console.error(error);
            } finally {
                processBtn.disabled = false;
            }
        });

        // 打开新窗口，使用 pdf.js 渲染 PDF 为图片，并模仿人教课本爬取器的界面
        function openPdfPreviewWindow(pdfBytes, title) {
            // 将 PDF 数据转为 base64
            const base64 = arrayBufferToBase64(pdfBytes);
            const dataUrl = 'data:application/pdf;base64,' + base64;

            // 新窗口 HTML
            const html = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>${title}预览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; font-family: sans-serif; }
        @page { margin: 0; }
        #statusArea {
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            padding: 6px 10px;
            border: 1px solid #aaa;
            font-size: 14px;
            z-index: 9999;
        }
        #controlPanel {
            position: fixed;
            top: 50px;
            right: 10px;
            background: white;
            padding: 8px;
            border: 1px solid #aaa;
            font-size: 14px;
            z-index: 9999;
        }
        button {
            margin: 2px;
            padding: 4px 8px;
            cursor: pointer;
        }
        .page-container {
            text-align: center;
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="pagesContainer"></div>
    <div id="statusArea">正在加载 PDF…</div>
    <div id="controlPanel">
        <button id="printActionBtn">强制调用打印</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"><\/script>
    <script>
        const dataUrl = "${dataUrl}";
        const statusDiv = document.getElementById('statusArea');
        const controlDiv = document.getElementById('controlPanel');
        const printBtn = document.getElementById('printActionBtn');
        const container = document.getElementById('pagesContainer');

        let totalPages = 0;
        let rendered = 0;
        let timeoutTriggered = false;

        function updateStatus() {
            statusDiv.textContent = '已加载 ' + rendered + ' / ' + totalPages;
            if (rendered >= totalPages && totalPages > 0) {
                statusDiv.textContent = '全部加载完成，可调用打印';
                printBtn.textContent = '调用打印';
            }
        }

        function renderPage(page, pageNum) {
            const viewport = page.getViewport({ scale: 10 }); // 提高清晰度
            const canvas = document.createElement('canvas');
            canvas.id = 'page_' + pageNum;
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const ctx = canvas.getContext('2d');
            
            const div = document.createElement('div');
            div.className = 'page-container';
            div.appendChild(canvas);
            container.appendChild(div);

            page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                if (timeoutTriggered) return;
                rendered++;
                updateStatus();
            }).catch(() => {
                // 渲染失败也计数
                if (timeoutTriggered) return;
                rendered++;
                updateStatus();
            });
        }

        const loadingTask = pdfjsLib.getDocument(dataUrl);
        loadingTask.promise.then((pdf) => {
            totalPages = pdf.numPages;
            statusDiv.textContent = '已加载 0 / ' + totalPages;

            for (let i = 1; i <= totalPages; i++) {
                pdf.getPage(i).then((page) => {
                    renderPage(page, i);
                }).catch(() => {
                    // 页面获取失败，仍然计数
                    if (timeoutTriggered) return;
                    rendered++;
                    updateStatus();
                });
            }

            // 超时兜底：30 秒后强制置为完成
            setTimeout(() => {
                if (rendered < totalPages) {
                    timeoutTriggered = true;
                    rendered = totalPages;
                    updateStatus();
                }
            }, 30000);
        }).catch((err) => {
            statusDiv.textContent = 'PDF 加载失败：' + err.message;
        });

        // 打印按钮
        printBtn.addEventListener('click', () => {
            statusDiv.style.display = 'none';
            controlDiv.style.display = 'none';
            setTimeout(() => {
                window.print();
                window.addEventListener('afterprint', () => {
                    statusDiv.style.display = 'block';
                    controlDiv.style.display = 'block';
                }, { once: true });
            }, 500);
        });
    <\/script>
</body>
</html>`;

            const w = window.open('', '_blank');
            if (!w) {
                alert('浏览器阻止了弹窗，请允许后重试');
                return;
            }
            w.document.write(html);
            w.document.close();
        }

        // 辅助函数：ArrayBuffer 转 Base64
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }
    </script>
</body>
</html>
